[project]
name = "bioauto"
version = "4.0.0"
description = "Bioinformatics Research Automation Platform - 올인원 연구 자동화"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "bioauto"}
]
keywords = ["bioinformatics", "nextflow", "rna-seq", "scrna-seq", "llm", "multi-agent"]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "biopython>=1.80",
]

[project.optional-dependencies]
translate = ["ollama>=0.4.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
enrichment = [
    "gseapy>=1.0.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]
tui = [
    "textual>=1.0.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
    "jinja2>=3.1.0",
]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
analysis = [
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "gseapy>=1.0.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "textual>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
    "jinja2>=3.1.0",
    "biopython>=1.80",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
bioauto = "core.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "backends*", "plugins*", "agents*", "enrichment*", "clients*", "search*", "mcp*", "rag*", "nextflow*", "analysis*", "tui*", "web*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["httpx.*", "openai.*", "anthropic.*", "gseapy.*", "Bio.*", "chromadb.*", "sentence_transformers.*", "scanpy.*", "anndata.*"]
ignore_missing_imports = true
